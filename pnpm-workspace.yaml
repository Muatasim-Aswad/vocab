packages:
  - apps/*
  - packages/*

allowBuilds:
  "@google/genai": false
  better-sqlite3: true
  esbuild: false
  protobufjs: false

catalog:
  "@types/node": ^26.6.5
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vite-plus: 1.5.1
  zod: 4.6.7

# Vite+: route `vite` to its core and pin the bundled Vitest (see vite-plus docs, local-cli)
minimumReleaseAgeExclude:
  - glob@14.0.6

overrides:
  fast-uri: 3.1.9
  source-map-js: 1.2.2
  body-parser: 2.4.0
  qs: 6.16.1
  serialize-javascript: 7.1.3
  happy-dom: 21.0.4
  "glob@>=9.0.0 <=14.0.1": 14.0.6
  "minimatch@>=7.0.0 <11.0.1": 11.0.8
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vitest: 5.1.0

# The `vite` alias reports Vite+'s version, which trips peer ranges like ^8
peerDependencyRules:
  allowedVersions:
    vite: "*"
