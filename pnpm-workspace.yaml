packages:
  - apps/*
  - packages/*

allowBuilds:
  "@google/genai": false
  better-sqlite3: true
  esbuild: false
  protobufjs: false

catalog:
  "@types/node": ^26.6.5
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0-rc.1
  vite-plus: 1.5.0
  zod: 4.6.7

# Vite+: route `vite` to its core and pin the bundled Vitest (see vite-plus docs, local-cli)
overrides:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0-rc.1
  vitest: 5.0.1

# The `vite` alias reports Vite+'s version, which trips peer ranges like ^8
peerDependencyRules:
  allowedVersions:
    vite: "*"
